<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHive | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #121212;
            --secondary-bg: #1E1E1E;
            --accent: #6C63FF;
            --text: #E0E0E0;
        }
        body {
            background: var(--primary-bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background: var(--secondary-bg);
            padding: 2rem;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .auth-tabs {
            display: flex;
            background: rgba(108, 99, 255, 0.1);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }
        .auth-tab {
            flex: 1;
            padding: 0.7rem;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
        }
        .auth-tab.active {
            background: var(--accent);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .auth-form.hidden {
            display: none;
        }
        .input-field {
            position: relative;
        }
        .input-field input {
            width: 100%;
            padding: 1rem;
            background: var(--primary-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--text);
        }
        .login-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 7L12 12L21 7L12 2Z" stroke="#6C63FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 12L12 17L21 12" stroke="#6C63FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 17L12 22L21 17" stroke="#6C63FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h1 style="margin: 0.5rem 0;">Game<span style="color: #6C63FF;">Hive</span></h1>
            <p style="color: #A0A0A0; margin: 0;">Where indie games thrive</p>
        </div>

        <!-- Login Type Toggle -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="player">Player</button>
            <button class="auth-tab" data-tab="developer">Developer</button>
        </div>

        <!-- Player Login Form -->
        <form id="player-form" class="auth-form">
            <div class="input-field">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-field">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
            <p style="text-align: center; color: #A0A0A0; margin-top: 1rem;">
                New to GameHive? <a href="#" style="color: #6C63FF;">Sign up</a>
            </p>
        </form>

        <!-- Developer Login Form -->
        <form id="developer-form" class="auth-form hidden">
            <div class="input-field">
                <input type="email" placeholder="Developer Email" required>
            </div>
            <div class="input-field">
                <input type="password" placeholder="Access Key" required>
            </div>
            <button type="submit" class="login-btn">Access Dev Portal</button>
            <p style="text-align: center; color: #A0A0A0; margin-top: 1rem;">
                Need an account? <a href="#" style="color: #6C63FF;">Apply here</a>
            </p>
        </form>
    </div>

    <script>
        // Tab switching
        const tabs = document.querySelectorAll('.auth-tab');
        const forms = document.querySelectorAll('.auth-form');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Update active tab
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Show correct form
                const formId = tab.dataset.tab + '-form';
                forms.forEach(form => {
                    form.classList.toggle('hidden', form.id !== formId);
                });
            });
        });

        // Form submissions
        document.getElementById('player-form').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'home.html';
        });

        document.getElementById('developer-form').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'developer-home.html';
        });
    </script>
</body>
</html>
